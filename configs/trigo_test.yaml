# Trigo Training Configuration
# Configuration for training models on Trigo game data

# Paths (will be set by Hydra at runtime, or can be overridden)
paths:
  root: .
  data: ${paths.root}/data
  output: ${paths.root}/outputs

# Data configuration
data:
  type: TGNDataset
  data_dir: ${paths.root}/third_party/trigo/trigo-web/tools/output
  max_length: 2048
  min_length: 10
  max_file_size: 10000
  tokenizer_config: {}

  # DataLoader settings
  loader:
    batch_size: 8
    shuffle: true
    num_workers: 4
    pin_memory: true

# Model configuration (placeholder for future)
model:
  type: transformer
  hidden_size: 256
  num_layers: 6
  num_heads: 8
  dropout: 0.1
  vocab_size: 259  # TGN byte tokenizer vocab size

# Training configuration
training:
  epochs: 100
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 1000
  max_grad_norm: 1.0

  # Checkpointing
  save_frequency: 10
  save_dir: ${paths.output}/checkpoints
  keep_n_checkpoints: 5

  # Logging
  log_frequency: 100
  wandb:
    enabled: false
    project: trigor
    entity: null
    tags: []

# Evaluation configuration
eval:
  eval_frequency: 5
  eval_batches: 50

# Device and seed
device: cuda
seed: 42

