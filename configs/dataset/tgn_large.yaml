# TGN Dataset Configuration (Large - for full training)
# Uses longer sequences for better context

# Dataset type (registered in trigor.data.registry)
type: TGNDataset

# Path to directory containing .tgn files
data_dir: ${paths.root}/third_party/trigo/trigo-web/tools/output

# Tokenization settings
max_length: 4096        # Longer sequences for full games
min_length: 10
max_file_size: 20000    # Allow larger files

# Optional tokenizer configuration
tokenizer_config: {}

# DataLoader settings (for reference)
dataloader:
  batch_size: 4         # Smaller batch for longer sequences
  shuffle: true
  num_workers: 4
  pin_memory: true
