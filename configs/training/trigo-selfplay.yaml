# Trigo Training with C++ Self-Play Data
# This config uses offline self-play games generated by trigo.cpp

# Experiment ID (determines output directory)
id: trigor/${date:}-${remove_local_suffix:${hydra:job.config_name}}

# Paths
paths:
  root: .
  data: ${paths.root}/data
  output: ${paths.root}/outputs

# Data configuration - Point to C++ self-play output
data:
  type: TGNDataset
  data_dir: /tmp/selfplay_test  # C++ generator output directory
  max_length: 8192
  min_length: 10
  max_file_size: 10000
  tokenizer_config: {}

  # Train/validation split
  # Format: "phases/cycle" or "*phases/cycle" (* for shuffle)
  # Phases support range syntax with '..' for convenience
  train_split: "*0..7/10"  # 80% training set with shuffle
  val_split: "8,9/10"      # 20% validation set without shuffle

  # DataLoader settings
  loader:
    batch_size: 2  # Small batch for testing
    shuffle: true
    num_workers: 0
    pin_memory: true

# Model configuration - Small GPT-2 for quick testing
model:
  type: AttentionCausalLoss
  config:
    model_config:
      type: GPT2CausalLM
      config:
        vocab_size: 128  # TGN compact tokenizer
        hidden_size: 128  # Reduced for faster training
        num_layers: 4     # Reduced for faster training
        num_heads: 4
        max_seq_len: 8192
        dropout: 0.1
        activation: gelu_new
        intermediate_size: 512  # FFN inner dimension
        layer_norm_eps: 1e-5
        use_cache: true
    ignore_index: 0  # PAD token ID
    label_smoothing: 0.1

# Training configuration
training:
  epochs: 5  # Quick test
  learning_rate: 3e-4
  weight_decay: 0.01
  warmup_steps: 100
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  epoch_size: null
  dtype: bfloat16  # Use bfloat16 for efficiency

  # Learning rate scheduler
  scheduler:
    type: cosine
    min_lr: 1e-6

  # Checkpointing
  save_frequency: 1
  keep_n_checkpoints: 3
  save_mode: best

  # Monitoring
  monitor:
    field: val_loss
    mode: min

  # Logging
  log_frequency: 4  # Log every 4 examples
  wandb:
    enabled: true
    tags:
      - cpp-selfplay
      - gpt2
      - offline-training

  tensorboard:
    enabled: false

  # Environment variables
  env: ~

# Evaluation configuration
eval:
  eval_frequency: 1  # Evaluate every epoch
  eval_batches: 10

# Device and reproducibility
device: cuda
seed: 42
deterministic: true
