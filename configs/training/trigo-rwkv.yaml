# Trigo RWKV Training Configuration
# RWKV with linear attention for efficient long-sequence processing

id: trigor/${date:}-${hydra:job.config_name}

# Paths
paths:
  root: .
  data: ${paths.root}/data
  output: ${paths.root}/outputs

# Data configuration
data:
  type: TGNDataset
  data_dir: ${paths.root}/third_party/trigo/trigo-web/tools/output
  max_length: 8192  # RWKV can handle longer sequences efficiently
  min_length: 10
  max_file_size: 10000
  tokenizer_config: {}

  # Train/validation split
  # Format: "phases/cycle" or "*phases/cycle" (* for shuffle)
  # Phases support range syntax with '..' for convenience
  # Example: "*0..7/10" = 80% for training (phases 0-7, shuffled)
  #          "8,9/10" = 20% for validation (no shuffle)
  train_split: "*0..7/10"  # 80% training set with shuffle
  val_split: "8,9/10"                  # 20% validation set without shuffle

  # DataLoader settings
  loader:
    batch_size: 8
    shuffle: true
    num_workers: 0  # Set to 0 to avoid multiprocessing issues with file I/O
    pin_memory: true

# Model configuration - RWKV wrapped in AttentionCausalLoss
model:
  type: AttentionCausalLoss
  config:
    model_config:
      type: RwkvCausalLM
      config:
        vocab_size: 259  # TGN byte tokenizer vocab size
        hidden_size: 256
        num_layers: 6
        max_seq_len: 8192
        intermediate_size: 1024  # Channel-mixing FFN dimension (4 * hidden_size)
        layer_norm_eps: 1e-5
        use_cache: true
    ignore_index: 256  # PAD token ID to ignore in loss computation
    label_smoothing: 0.1  # Label smoothing factor for regularization

# Training configuration
training:
  epochs: 100
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 1000
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  dtype: float32  # Model dtype: float32, float16, bfloat16
  epoch_size: null  # Number of examples per epoch (null = full dataset, can repeat/subsample)

  # Learning rate scheduler
  scheduler:
    type: cosine  # cosine, linear, constant, inverse_sqrt, lambda
    min_lr: 1e-6  # For cosine and linear schedulers

  # Checkpointing
  save_frequency: 1  # Save every N validations (not epochs)
  keep_n_checkpoints: 3
  save_mode: best  # 'best', 'all', or 'latest'

  # Monitoring
  monitor:
    field: val_loss
    mode: min  # 'min' for loss, 'max' for accuracy

  # Logging
  log_frequency: 100  # Log every N examples (not steps)
  wandb:
    enabled: true
    # project is trigor by default
    # name will be set to config.id automatically
    tags:
      - rwkv
      - linear-attention
      - efficient

  # Trainer-specific environment variables (only affects trainer operations)
  env: ~

# Evaluation configuration
eval:
  eval_frequency: 2  # Evaluate every N epochs
  eval_batches: 50

# Device and reproducibility
device: cuda
seed: 42
deterministic: true
