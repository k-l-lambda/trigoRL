# Trigo GPT-2 Training Configuration with Inverse Square Root Scheduler
# Uses the Transformer-style learning rate schedule from "Attention Is All You Need"

id: trigor/${date:}-${hydra:job.config_name}

# Paths
paths:
  root: .
  data: ${paths.root}/data
  output: ${paths.root}/outputs

# Data configuration
data:
  type: TGNDataset
  data_dir: ${paths.root}/third_party/trigo/trigo-web/tools/output
  max_length: 8192
  min_length: 10
  max_file_size: 10000
  tokenizer_config: {}

  # Train/validation split
  train_split: "*0..7/10"  # 80% training set with shuffle
  val_split: "8,9/10"      # 20% validation set without shuffle

  # DataLoader settings
  loader:
    batch_size: 8
    shuffle: true
    num_workers: 0  # Set to 0 to avoid multiprocessing issues with file I/O
    pin_memory: true

# Model configuration - GPT-2 wrapped in AttentionCausalLoss
model:
  type: AttentionCausalLoss
  config:
    model_config:
      type: GPT2CausalLM
      config:
        vocab_size: 259
        hidden_size: 256
        num_layers: 6
        num_heads: 8
        max_seq_len: 8192
        dropout: 0.1
        activation: gelu_new
        intermediate_size: 1024
        layer_norm_eps: 1e-5
        use_cache: true
    ignore_index: 256
    label_smoothing: 0.1

# Training configuration
training:
  epochs: 100
  learning_rate: 1.0  # Will be scaled by scheduler
  weight_decay: 0.01
  warmup_steps: 4000  # Transformer default
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  dtype: float32  # Model dtype: float32, float16, bfloat16
  epoch_size: null  # Number of examples per epoch (null = full dataset, can repeat/subsample)

  # Inverse square root scheduler (Transformer-style)
  # Formula: lr = lr_mul * (d_model^-0.5) * min(step^-0.5, step * warmup^-1.5)
  scheduler:
    type: inverse_sqrt
    d_model: 256      # Should match model hidden_size
    lr_mul: 1.0       # Learning rate multiplier

  # Checkpointing
  save_frequency: 1  # Save every N validations (not epochs)
  save_dir: ${paths.output}/checkpoints/gpt2-invsqrt
  keep_n_checkpoints: 5
  save_mode: best

  # Monitoring
  monitor:
    field: val_loss
    mode: min

  # Logging
  log_frequency: 100  # Log every N examples (not steps)
  wandb:
    enabled: false
    project: trigor
    entity: null
    # name will be set to config.id automatically
    tags: [gpt2, mha, inverse_sqrt]

# Evaluation configuration
eval:
  eval_frequency: 5
  eval_batches: 50

# Device and reproducibility
device: cuda
seed: 42
deterministic: true
