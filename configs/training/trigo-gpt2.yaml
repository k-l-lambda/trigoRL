# Trigo GPT-2 Training Configuration
# GPT-2 with standard multi-head attention (MHA)

# Paths
paths:
  root: .
  data: ${paths.root}/data
  output: ${paths.root}/outputs

# Data configuration
data:
  type: TGNDataset
  data_dir: ${paths.root}/third_party/trigo/trigo-web/tools/output
  max_length: 2048
  min_length: 10
  max_file_size: 10000
  tokenizer_config: {}

  # DataLoader settings
  loader:
    batch_size: 8
    shuffle: true
    num_workers: 4
    pin_memory: true

# Model configuration - GPT-2
model:
  type: GPT2CausalLM
  vocab_size: 259  # TGN byte tokenizer vocab size
  hidden_size: 256
  num_layers: 6
  num_heads: 8
  max_seq_len: 2048
  dropout: 0.1
  activation: gelu_new
  intermediate_size: 1024  # FFN inner dimension (4 * hidden_size)
  layer_norm_eps: 1e-5
  use_cache: true

# Training configuration
training:
  epochs: 100
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 1000
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1

  # Learning rate scheduler
  scheduler:
    type: cosine  # cosine, linear, constant
    min_lr: 1e-6

  # Checkpointing
  save_frequency: 10  # Save every N epochs
  save_dir: ${paths.output}/checkpoints/gpt2
  keep_n_checkpoints: 5
  save_mode: best  # 'best', 'all', or 'latest'

  # Monitoring
  monitor:
    field: val_loss
    mode: min  # 'min' for loss, 'max' for accuracy

  # Logging
  log_frequency: 100  # Log every N steps
  wandb:
    enabled: false
    project: trigor
    entity: null
    name: trigo-gpt2
    tags: [gpt2, mha, baseline]

# Evaluation configuration
eval:
  eval_frequency: 5  # Evaluate every N epochs
  eval_batches: 50

# Device and reproducibility
device: cuda
seed: 42
deterministic: true
