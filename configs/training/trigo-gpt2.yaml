# Trigo Training Configuration
# Configuration for training models on Trigo game data

# Paths (will be set by Hydra at runtime, or can be overridden)
paths:
  root: .
  data: ${paths.root}/data
  output: ${paths.root}/outputs

# Data configuration
data:
  type: TGNDataset
  data_dir: ${paths.root}/third_party/trigo/trigo-web/tools/output
  max_length: 2048
  min_length: 10
  max_file_size: 10000
  tokenizer_config: {}

  # DataLoader settings
  loader:
    batch_size: 8
    shuffle: true
    num_workers: 4
    pin_memory: true

# Model configuration
# Choose from: gpt2, llama, rwkv, xlstm
model:
  type: GPT2CausalLM  # Model architecture type
  vocab_size: 259  # TGN byte tokenizer vocab size
  hidden_size: 256
  num_layers: 6
  num_heads: 8
  max_seq_len: 2048
  dropout: 0.1
