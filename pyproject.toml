[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trigor"
version = "0.1.0"
description = "Reinforcement learning laboratory for training AI agents to play Trigo, a 3D variant of Go"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "TrigoRL Contributors"}
]
keywords = ["reinforcement-learning", "go", "trigo", "deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "wandb>=0.15.0",
    "gymnasium>=0.29.0",
    "onnx>=1.14.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black-with-tabs>=23.0.0",
    "ruff>=0.0.280",
]

[project.urls]
Homepage = "https://github.com/k-l-lambda/trigoRL"
Repository = "https://github.com/k-l-lambda/trigoRL"

[tool.setuptools]
packages = ["trigor"]

[tool.black]
# Line length
line-length = 120

# Python versions
target-version = ['py38', 'py39', 'py310', 'py311']

# Use tabs for indentation
use-tabs = true

# Keep original string quotes
skip-string-normalization = true

# Blank lines: 2 between top-level definitions (default, per PEP 8, not configurable)

# File patterns
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
